<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Команды СШ №17 Томск — футбол по годам рождения</title>
  <meta name="description" content="18 команд спортивной школы №17 Томска: мальчики 2006–2018 годов рождения и женская команда. Тренеры, составы, этапы подготовки.">
  <link rel="icon" href="https://sh17.ru/images/logoSH.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@500;600&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="teams">
<main id="main">
  <section class="page-hero on-ink">
    <div class="ghost-year">2018</div>
    <div class="container">
      <nav class="crumbs" aria-label="Хлебные крошки"><a href="index.html">Главная</a><span>Команды</span></nav>
      <h1 class="display h1">Команды школы</h1>
      <p class="lead">18 команд: мальчики 2006–2018 годов рождения и женская команда. У каждой — свой тренер-преподаватель, программа этапа и календарь турниров</p>
    </div>
  </section>

  <section class="section" style="padding-top:48px">
    <div class="container">
      <nav class="years-rail" id="yearRail" aria-label="Год рождения"></nav>
      <div class="chips" id="stageChips" style="margin-bottom:32px">
        <button class="chip" data-v="all" aria-pressed="true">Все этапы</button>
        <button class="chip" data-v="so" aria-pressed="false">Спортивно-оздоровительный</button>
        <button class="chip" data-v="np" aria-pressed="false">Начальная подготовка</button>
        <button class="chip" data-v="ut" aria-pressed="false">Учебно-тренировочный</button>
        <button class="chip" data-v="ss" aria-pressed="false">Совершенствование</button>
      </div>
      <div class="team-grid" id="teams"></div>
    </div>
  </section>

  <section class="section ink on-ink">
    <div class="container">
      <div class="section-head">
        <div class="titles"><span class="kicker">Путь футболиста</span><h2 class="display h2">Четыре этапа подготовки</h2></div>
        <a class="btn btn-light" href="join.html">Как поступить</a>
      </div>
      <div class="pathway" id="pathway"></div>
    </div>
  </section>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
window.page = () => {
  const years = ['Все', ...new Set(TEAMS.filter(t => !t.girls).map(t => t.year)).values(), 'ЖФК'];
  $('#yearRail').innerHTML = years.map((y, i) => `<a href="#" data-y="${y}" class="${i ? '' : 'active'}">${y}</a>`).join('');
  let year = 'Все', stage = 'all';
  const draw = () => {
    const list = TEAMS.filter(t => (year === 'Все' || t.year === year) && (stage === 'all' || t.stage === stage));
    $('#teams').innerHTML = list.length ? list.map(teamCard).join('') : '<p class="muted">Нет команд по выбранным условиям</p>';
  };
  $$('#yearRail a').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); year = a.dataset.y;
    $$('#yearRail a').forEach(x => x.classList.toggle('active', x === a)); draw();
  }));
  initChips($('#stageChips'), v => { stage = v; draw(); });
  draw();
  $('#pathway').innerHTML = Object.entries(STAGES).map(([k, s], i) => `
    <div class="step on"><span class="dot">${i + 1}</span><span class="age">${s.age}</span><h4>${s.name}</h4><p>${s.text}</p>
    <p style="margin-top:8px;color:var(--on-ink-3);font-size:14px">${TEAMS.filter(t => t.stage === k).map(t => t.girls ? 'ЖФК' : t.year).filter((v, j, a) => a.indexOf(v) === j).join(' · ')}</p></div>`).join('');
};
</script>
</body>
</html>
